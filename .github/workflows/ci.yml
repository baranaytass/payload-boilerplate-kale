name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    # A build needs a reachable database: Payload connects while collecting page
    # data. Postgres runs as a service so this stays a real build, not a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kale
          POSTGRES_PASSWORD: kale
          POSTGRES_DB: kale_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          DATABASE_URI: postgresql://kale:kale@localhost:5432/kale_ci
          POSTGRES_URL: postgresql://kale:kale@localhost:5432/kale_ci
          PAYLOAD_SECRET: ci-secret-not-used-in-production-0123456789abcdef
          PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kale
          POSTGRES_PASSWORD: kale
          POSTGRES_DB: kale_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://kale:kale@localhost:5432/kale_e2e
      POSTGRES_URL: postgresql://kale:kale@localhost:5432/kale_e2e
      PAYLOAD_SECRET: ci-secret-not-used-in-production-0123456789abcdef
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
